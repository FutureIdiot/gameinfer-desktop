name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameinfer-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  PACKAGE_VERSION: "0.2.0"
  MODEL_ARCHIVE_NAME: GAME-1.0.3-small-onnx.zip
  MODEL_ARCHIVE_SIZE: "45676364"
  MODEL_ARCHIVE_SHA256: 00ba0c64115b6b874d9ea4afd3e6cf822abda2a04e52569233b0a044fd40e4e8
  MODEL_URL: https://github.com/openvpi/GAME/releases/download/v1.0.3/GAME-1.0.3-small-onnx.zip
  SEPARATOR_MODEL_NAME: Kim_Vocal_2.onnx
  SEPARATOR_MODEL_SIZE: "66759214"
  SEPARATOR_MODEL_SHA256: ce74ef3b6a6024ce44211a07be9cf8bc6d87728cc852a68ab34eb8e58cde9c8b
  SEPARATOR_MODEL_URL: https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/Kim_Vocal_2.onnx

jobs:
  package:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install separator runtime launcher
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: src/apps/GameInfer/workers/uv.lock

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.3"

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 14bb451131ccf6be50a63a8d9dfe7980e46b5958

      - name: Install dependencies
        shell: pwsh
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
          QT_DIR: ${{ env.QT_ROOT_DIR }}
          Qt6_DIR: ${{ env.QT_ROOT_DIR }}
          VCPKG_KEEP_ENV_VARS: CMAKE_PREFIX_PATH;QT_DIR;Qt6_DIR
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --x-install-root="$env:GITHUB_WORKSPACE/vcpkg_installed" `
            --triplet=x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed: $LASTEXITCODE" }

      - name: Install ONNX Runtime with DirectML
        shell: pwsh
        working-directory: src/libs
        run: |
          cmake -Dep=dml -P ../../scripts/setup-onnxruntime.cmake
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime setup failed: $LASTEXITCODE" }

      - name: Download and verify bundled models
        shell: pwsh
        run: |
          $modelRoot = Join-Path $env:GITHUB_WORKSPACE "models"
          New-Item -ItemType Directory -Force $modelRoot | Out-Null

          $gameArchive = Join-Path $env:RUNNER_TEMP $env:MODEL_ARCHIVE_NAME
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $gameArchive
          if ((Get-Item $gameArchive).Length -ne [int64]$env:MODEL_ARCHIVE_SIZE) { throw "GAME model size mismatch" }
          $gameHash = (Get-FileHash $gameArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gameHash -ne $env:MODEL_ARCHIVE_SHA256) { throw "GAME model hash mismatch" }
          Expand-Archive $gameArchive $modelRoot -Force

          $separatorModel = Join-Path $modelRoot $env:SEPARATOR_MODEL_NAME
          Invoke-WebRequest -Uri $env:SEPARATOR_MODEL_URL -OutFile $separatorModel
          if ((Get-Item $separatorModel).Length -ne [int64]$env:SEPARATOR_MODEL_SIZE) { throw "Separator model size mismatch" }
          $separatorHash = (Get-FileHash $separatorModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($separatorHash -ne $env:SEPARATOR_MODEL_SHA256) { throw "Separator model hash mismatch" }

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-win -G Ninja `
            -DBUILD_TESTS:BOOL=TRUE `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_INSTALLED_DIR="$env:GITHUB_WORKSPACE/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DONNXRUNTIME_ENABLE_DML:BOOL=ON `
            -DGAMEINFER_REQUIRE_SEPARATOR_UV:BOOL=ON `
            -DGAMEINFER_DEFAULT_GAME_MODEL_DIR="$env:GITHUB_WORKSPACE/models/GAME-1.0.3-small-onnx" `
            -DGAMEINFER_REQUIRE_DEFAULT_GAME_MODEL:BOOL=ON `
            -DGAMEINFER_SEPARATOR_DEFAULT_MODEL="$env:GITHUB_WORKSPACE/models/$env:SEPARATOR_MODEL_NAME" `
            -DGAMEINFER_REQUIRE_SEPARATOR_DEFAULT_MODEL:BOOL=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed: $LASTEXITCODE" }
          cmake --build build-win --target GameInfer TestGameInferQueue TestGameInferWorkspace TestGameInferManualSlice
          if ($LASTEXITCODE -ne 0) { throw "GameInfer build failed: $LASTEXITCODE" }

      - name: Run focused tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows\bin;$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          & "build-win/bin/TestGameInferQueue.exe"
          if ($LASTEXITCODE -ne 0) { throw "Queue tests failed: $LASTEXITCODE" }
          & "build-win/bin/TestGameInferWorkspace.exe"
          if ($LASTEXITCODE -ne 0) { throw "Workspace tests failed: $LASTEXITCODE" }
          & "build-win/bin/TestGameInferManualSlice.exe"
          if ($LASTEXITCODE -ne 0) { throw "Manual slice tests failed: $LASTEXITCODE" }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "package"
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item "build-win/bin/*" $root -Recurse -Force
          Copy-Item "src/libs/onnxruntime/lib/*.dll" $root -Force
          Copy-Item "vcpkg_installed/x64-windows/bin/*.dll" $root -Force
          Copy-Item "LICENSE" (Join-Path $root "LICENSE.txt") -Force
          Copy-Item "NOTICE" (Join-Path $root "NOTICE.txt") -Force
          $exe = Join-Path $root "GameInfer.exe"
          & (Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe") --release --libdir $root --plugindir (Join-Path $root "plugins") --no-translations --no-system-d3d-compiler --no-opengl-sw --force $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          if (-not (Test-Path $exe)) { throw "GameInfer.exe was not produced" }
          $required = @(
            "model/GAME-1.0.3-small-onnx/config.json",
            "model/GAME-1.0.3-small-onnx/encoder.onnx",
            "model/separator/$env:SEPARATOR_MODEL_NAME",
            "separator-runtime/uv.exe",
            "separator-worker/.python-version",
            "plugins/platforms/qwindows.dll"
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $root $path))) { throw "Required package file is missing: $path" }
          }

          $distributionName = "GameInfer-windows-x64-v$env:PACKAGE_VERSION"
          $distributionRoot = Join-Path $env:GITHUB_WORKSPACE $distributionName
          Move-Item $root $distributionRoot
          & 7z a -tzip "$distributionName.zip" $distributionName
          if ($LASTEXITCODE -ne 0) { throw "Archive creation failed: $LASTEXITCODE" }
          & 7z t "$distributionName.zip"
          if ($LASTEXITCODE -ne 0) { throw "Archive validation failed: $LASTEXITCODE" }
          $digest = (Get-FileHash "$distributionName.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $distributionName.zip" | Set-Content "$distributionName.zip.sha256" -Encoding ascii

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GameInfer-windows-x64-v${{ env.PACKAGE_VERSION }}
          path: |
            GameInfer-windows-x64-v${{ env.PACKAGE_VERSION }}.zip
            GameInfer-windows-x64-v${{ env.PACKAGE_VERSION }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
